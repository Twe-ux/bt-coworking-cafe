<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design 1 - Minimal Google Calendar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Google Sans', 'Roboto', -apple-system, sans-serif;
      background: #fff;
      padding: 20px;
    }

    .calendar-container {
      max-width: 1400px;
      margin: 0 auto;
      background: white;
    }

    /* Toolbar */
    .calendar-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid #dadce0;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .today-btn {
      background: white;
      border: 1px solid #dadce0;
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      color: #3c4043;
      cursor: pointer;
      transition: all 0.2s;
    }

    .today-btn:hover {
      background: #f1f3f4;
      box-shadow: 0 1px 2px rgba(60, 64, 67, 0.3);
    }

    .nav-buttons {
      display: flex;
      gap: 4px;
    }

    .nav-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: white;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .nav-btn:hover {
      background: #f1f3f4;
    }

    .current-date {
      font-size: 22px;
      font-weight: 400;
      color: #3c4043;
    }

    .view-selector {
      display: flex;
      gap: 0;
      border: 1px solid #dadce0;
      border-radius: 4px;
      overflow: hidden;
    }

    .view-btn {
      background: white;
      border: none;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      color: #3c4043;
      cursor: pointer;
      border-right: 1px solid #dadce0;
      transition: background 0.2s;
    }

    .view-btn:last-child {
      border-right: none;
    }

    .view-btn.active {
      background: #e8f0fe;
      color: #1a73e8;
    }

    .view-btn:hover:not(.active) {
      background: #f1f3f4;
    }

    /* Calendar Grid */
    .calendar-grid {
      display: flex;
      height: 800px;
    }

    /* Time labels */
    .time-labels {
      width: 64px;
      border-right: 1px solid #dadce0;
      padding-top: 48px;
    }

    .time-label {
      height: 60px;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      padding-right: 8px;
      font-size: 11px;
      color: #70757a;
      transform: translateY(-8px);
    }

    /* Days grid */
    .days-container {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Day headers */
    .day-headers {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-bottom: 1px solid #dadce0;
      height: 48px;
    }

    .day-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-right: 1px solid #dadce0;
      gap: 2px;
    }

    .day-header:last-child {
      border-right: none;
    }

    .day-name {
      font-size: 11px;
      font-weight: 500;
      color: #70757a;
      text-transform: uppercase;
    }

    .day-number {
      font-size: 24px;
      font-weight: 400;
      color: #3c4043;
    }

    .day-number.today {
      background: #1a73e8;
      color: white;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    /* Time grid */
    .time-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      flex: 1;
      position: relative;
      overflow-y: auto;
    }

    .day-column {
      border-right: 1px solid #dadce0;
      position: relative;
    }

    .day-column:last-child {
      border-right: none;
    }

    /* Hour lines */
    .hour-lines {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .hour-line {
      height: 60px;
      border-bottom: 1px solid #f1f3f4;
    }

    .hour-line:nth-child(2n) {
      border-bottom-color: #dadce0;
    }

    /* Events */
    .event {
      position: absolute;
      left: 2px;
      right: 2px;
      background: #039be5;
      color: white;
      border-radius: 2px;
      padding: 4px 6px;
      font-size: 12px;
      cursor: pointer;
      overflow: hidden;
      transition: box-shadow 0.2s;
      border-left: 3px solid #0277bd;
    }

    .event:hover {
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      z-index: 10;
    }

    .event-title {
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .event-time {
      font-size: 11px;
      opacity: 0.9;
      margin-top: 2px;
    }

    /* Current time indicator */
    .current-time-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: #ea4335;
      z-index: 5;
      pointer-events: none;
    }

    .current-time-line::before {
      content: '';
      position: absolute;
      left: -6px;
      top: -5px;
      width: 12px;
      height: 12px;
      background: #ea4335;
      border-radius: 50%;
    }
  </style>
</head>
