<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design 3 - Clean Google Calendar Style</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Product Sans', 'Google Sans', 'Roboto', -apple-system, sans-serif;
      background: #ffffff;
      padding: 0;
    }

    .calendar-container {
      max-width: 100%;
      margin: 0 auto;
      background: white;
    }

    /* Toolbar */
    .calendar-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid #e0e0e0;
      background: white;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hamburger-btn {
      width: 48px;
      height: 48px;
      border: none;
      background: transparent;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      font-size: 20px;
      color: #5f6368;
    }

    .hamburger-btn:hover {
      background: #f1f3f4;
    }

    .today-btn {
      background: white;
      border: 1px solid #dadce0;
      padding: 0 16px;
      height: 36px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      color: #3c4043;
      cursor: pointer;
      transition: all 0.2s;
    }

    .today-btn:hover {
      background: #f8f9fa;
      border-color: #dadce0;
      box-shadow: 0 1px 1px 0 rgba(60,64,67,0.08), 0 1px 3px 1px rgba(60,64,67,0.16);
    }

    .nav-buttons {
      display: flex;
      gap: 0;
    }

    .nav-btn {
      width: 48px;
      height: 48px;
      border: none;
      background: transparent;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      font-size: 18px;
      color: #3c4043;
    }

    .nav-btn:hover {
      background: #f1f3f4;
    }

    .current-date {
      font-size: 22px;
      font-weight: 400;
      color: #3c4043;
      letter-spacing: 0;
    }

    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 48px;
      height: 48px;
      border: none;
      background: transparent;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      font-size: 20px;
      color: #5f6368;
    }

    .icon-btn:hover {
      background: #f1f3f4;
    }

    .view-dropdown {
      position: relative;
    }

    .view-btn {
      background: white;
      border: 1px solid #dadce0;
      padding: 0 12px 0 16px;
      height: 36px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      color: #3c4043;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .view-btn:hover {
      background: #f8f9fa;
      box-shadow: 0 1px 1px 0 rgba(60,64,67,0.08), 0 1px 3px 1px rgba(60,64,67,0.16);
    }

    /* Calendar Grid */
    .calendar-wrapper {
      display: flex;
      height: calc(100vh - 61px);
    }

    .calendar-grid {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Time labels */
    .time-labels {
      width: 56px;
      border-right: 1px solid #dadce0;
      padding-top: 48px;
      flex-shrink: 0;
    }

    .time-label {
      height: 48px;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      padding-right: 8px;
      font-size: 10px;
      color: #70757a;
      transform: translateY(-6px);
    }

    /* Days grid */
    .days-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Day headers */
    .day-headers {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-bottom: 1px solid #dadce0;
      height: 48px;
      flex-shrink: 0;
    }

    .day-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-right: 1px solid #dadce0;
      padding: 8px 4px;
    }

    .day-header:last-child {
      border-right: none;
    }

    .day-name {
      font-size: 11px;
      font-weight: 500;
      color: #70757a;
      text-transform: uppercase;
    }

    .day-number {
      font-size: 26px;
      font-weight: 400;
      color: #3c4043;
      line-height: 1;
    }

    .day-number.today {
      background: #1a73e8;
      color: white;
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      margin-top: 2px;
    }

    /* Time grid */
    .time-grid-wrapper {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .time-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      position: relative;
      min-height: 100%;
    }

    .day-column {
      border-right: 1px solid #dadce0;
      position: relative;
      min-height: 576px;
    }

    .day-column:last-child {
      border-right: none;
    }

    /* Hour lines */
    .hour-lines {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .hour-line {
      height: 48px;
      border-bottom: 1px solid #f1f3f4;
    }

    .hour-line:nth-child(odd) {
      border-bottom: 1px solid #dadce0;
    }

    /* Events */
    .event {
      position: absolute;
      left: 1px;
      right: 1px;
      background: #039be5;
      color: #174ea6;
      border-radius: 0;
      padding: 2px 8px;
      font-size: 12px;
      cursor: pointer;
      overflow: hidden;
      transition: box-shadow 0.1s;
      border-left: 4px solid #0277bd;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .event:hover {
      box-shadow: 0 4px 8px 0 rgba(60,64,67,0.3), 0 2px 4px 0 rgba(60,64,67,0.15);
      z-index: 10;
    }

    .event.blue {
      background: #e3f2fd;
      border-left-color: #1976d2;
      color: #0d47a1;
    }

    .event.green {
      background: #e8f5e9;
      border-left-color: #388e3c;
      color: #1b5e20;
    }

    .event.orange {
      background: #fff3e0;
      border-left-color: #f57c00;
      color: #e65100;
    }

    .event.red {
      background: #ffebee;
      border-left-color: #d32f2f;
      color: #b71c1c;
    }

    .event-title {
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 16px;
    }

    .event-time {
      font-size: 11px;
      opacity: 0.8;
      line-height: 14px;
    }

    /* Current time indicator */
    .current-time-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: #ea4335;
      z-index: 5;
      pointer-events: none;
    }

    .current-time-line::before {
      content: '';
      position: absolute;
      left: -6px;
      top: -5px;
      width: 12px;
      height: 12px;
      background: #ea4335;
      border-radius: 50%;
    }

    /* Scrollbar styling */
    .time-grid-wrapper::-webkit-scrollbar {
      width: 12px;
    }

    .time-grid-wrapper::-webkit-scrollbar-track {
      background: white;
    }

    .time-grid-wrapper::-webkit-scrollbar-thumb {
      background: #dadce0;
      border-radius: 6px;
      border: 3px solid white;
    }

    .time-grid-wrapper::-webkit-scrollbar-thumb:hover {
      background: #bdc1c6;
    }

    /* All day events area */
    .all-day-events {
      min-height: 32px;
      border-bottom: 1px solid #dadce0;
      background: #fafafa;
      padding: 4px 0;
    }
  </style>
</head>
